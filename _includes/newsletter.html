<!-- =============================================================================
  _includes/newsletter.html
  Tunjos Smartletter signup through a Cloudflare Worker and Resend.
  ============================================================================= -->
<aside class="newsletter" aria-label="Newsletter signup">
  <h3 class="newsletter__title">Enjoyed this post?</h3>
  <p class="newsletter__body">Subscribe to get new posts delivered to your inbox.</p>

  <form
    class="newsletter__form"
    id="newsletter-form"
    novalidate
    aria-label="Email newsletter signup">

    <div class="newsletter__fields">
      <label class="newsletter__label" for="newsletter-email">
        Email address
      </label>
      <div class="newsletter__input-row">
        <input
          class="newsletter__input"
          id="newsletter-email"
          type="email"
          name="email"
          placeholder="you@example.com"
          autocomplete="email"
          required
          aria-required="true"
          aria-describedby="newsletter-status">
        <button
          class="newsletter__submit"
          type="submit"
          aria-label="Subscribe to newsletter">
          Subscribe
        </button>
      </div>

      <div class="newsletter__honeypot" aria-hidden="true">
        <label for="newsletter-website">Leave this field blank</label>
        <input
          id="newsletter-website"
          type="text"
          name="website"
          tabindex="-1"
          autocomplete="off">
      </div>
    </div>

    <p
      class="newsletter__status"
      id="newsletter-status"
      role="status"
      aria-live="polite"
      hidden></p>

  </form>
</aside>

<script>
(function () {
  'use strict';

  var ENDPOINT = 'https://tunjos-smartletter.tunjos.workers.dev/subscribe';

  var form   = document.getElementById('newsletter-form');
  var status = document.getElementById('newsletter-status');

  if (!form || !status) return;

  function setStatus(message, isError) {
    status.textContent  = message;
    status.hidden       = false;
    status.className    = 'newsletter__status' + (isError ? ' newsletter__status--error' : ' newsletter__status--success');
  }

  form.addEventListener('submit', function (e) {
    e.preventDefault();

    var email   = form.querySelector('#newsletter-email').value.trim();
    var website = form.querySelector('#newsletter-website').value;

    if (!email) {
      setStatus('Please enter your email address.', true);
      return;
    }

    var submitBtn = form.querySelector('.newsletter__submit');
    submitBtn.disabled   = true;
    submitBtn.textContent = 'Subscribing…';
    status.hidden = true;

    fetch(ENDPOINT, {
      method: 'POST',
      body: JSON.stringify({ email: email, website: website }),
      headers: { 'Content-Type': 'application/json' }
    })
      .then(function (res) {
        return res.json()
          .catch(function () { return {}; })
          .then(function (data) { return { ok: res.ok, data: data }; });
      })
      .then(function (result) {
        if (result.ok && result.data.success) {
          setStatus(result.data.message || 'Thanks for subscribing!', false);
          form.reset();
        } else {
          setStatus(result.data.message || 'Something went wrong. Please try again.', true);
        }
      })
      .catch(function () {
        setStatus('Could not connect. Please try again later.', true);
      })
      .finally(function () {
        submitBtn.disabled    = false;
        submitBtn.textContent = 'Subscribe';
      });
  });
}());
</script>
